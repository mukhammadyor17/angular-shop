<section class="profile page">
  <div class="container">

    <app-base-title>
      My Profile
    </app-base-title>

    <app-profile-card
      [user]="user()!"
    />

    <div class="profile-content">

      <div class="profile-header">

        <button
          type="button"
          class="btn btn-secondary"
          (click)="toggleEditMode()"
        >
          {{
            isEditMode()
              ? 'Cancel'
              : 'Edit Profile'
          }}
        </button>

      </div>

      <form
        class="profile-form"
        [formGroup]="profileForm"
        (ngSubmit)="saveProfile()"
      >

        <div class="photo-section">

          <img
            class="profile-photo"
            [src]="
              profileForm.value.photoUrl ||
              'assets/images/avatar-placeholder.png'
            "
            alt="Profile photo"
          />

          <div class="form-group">

            <label>
              Photo URL
            </label>

            <input
              type="text"
              formControlName="photoUrl"
              [readonly]="!isEditMode()"
            />

          </div>

        </div>

        <div class="profile-grid">

          <div class="form-group">

            <label>
              Name
            </label>

            <input
              type="text"
              formControlName="firstName"
              [readonly]="!isEditMode()"
            />

            <label>
              Last Name
            </label>

            <input
              type="text"
              formControlName="lastName"
              [readonly]="!isEditMode()"
            />

          </div>

          <div class="form-group">

            <label>
              Email
            </label>

            <input
              type="email"
              formControlName="email"
              [readonly]="!isEditMode()"
            />

          </div>

          <div class="form-group">

            <label>
              Birth Date
            </label>

            <input
              type="date"
              formControlName="dateOfBirth"
              [readonly]="!isEditMode()"
            />

          </div>

        </div>

        <button
          type="submit"
          class="btn btn-primary btn-save"
        >
          Save Changes
        </button>

      </form>

    </div>

  </div>
</section>
