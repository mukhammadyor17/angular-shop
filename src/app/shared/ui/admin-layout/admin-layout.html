<header class="al-header">
  <a class="al-brand" routerLink="/admin">SHOP.CO</a>
  <div class="al-header__badge">Admin Panel</div>
  <nav class="al-header__nav">
    <a class="al-header__nav-link" routerLink="/">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/>
      </svg>
      Home
    </a>
    <a class="al-header__nav-link al-header__nav-link--logout" routerLink="/login">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/>
      </svg>
      Logout
    </a>
  </nav>
</header>

<div class="al-body">
  <aside class="al-sidebar">
    <p class="al-sidebar__section-label">Menu</p>
    <nav class="al-sidebar__nav">
      <a
        class="al-sidebar__link"
        routerLink="/admin"
        routerLinkActive="al-sidebar__link--active"
        [routerLinkActiveOptions]="{ exact: true }"
      >
        <span class="al-sidebar__icon">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 0 1-8 0"/>
          </svg>
        </span>
        Products
      </a>

      <a
        class="al-sidebar__link"
        routerLink="/admin/category"
        routerLinkActive="al-sidebar__link--active"
        [routerLinkActiveOptions]="{ exact: true }"
      >
        <span class="al-sidebar__icon">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/>
          </svg>
        </span>
        Categories
      </a>
    </nav>
  </aside>

  <main class="al-content">
    <router-outlet></router-outlet>
  </main>
</div>
