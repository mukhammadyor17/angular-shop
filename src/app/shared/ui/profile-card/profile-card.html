@if (user()) {
<app-base-card class="profile-card">
  <div class="profile-card__avatar">
    <img [src]="user()!.photoUrl" alt="User photo" />
  </div>
  <div class="profile-card__info">
    <h2>{{ user()!.firstName }} {{ user()!.lastName }}</h2>
    <p>{{ user()!.email }}</p>
  </div>
</app-base-card>
}
